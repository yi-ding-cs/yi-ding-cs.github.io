{% include base_path %}

<!-- start custom head snippets -->

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Academicons: Google Scholar, ORCID, etc. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

<!-- Favicons -->
<link rel="apple-touch-icon"
      sizes="180x180"
      href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>

<link rel="icon"
      type="image/svg+xml"
      href="{{ base_path }}/images/favicon.svg"/>

<link rel="icon"
      type="image/png"
      href="{{ base_path }}/images/favicon-32x32.png"
      sizes="32x32"/>

<link rel="icon"
      type="image/png"
      href="{{ base_path }}/images/favicon-192x192.png"
      sizes="192x192"/>

<link rel="manifest"
      href="{{ base_path }}/images/manifest.json"/>

<link rel="icon"
      href="{{ base_path }}/images/favicon.ico"/>

<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- end custom head snippets -->
